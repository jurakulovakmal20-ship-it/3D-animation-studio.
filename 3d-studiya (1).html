<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Studiya</title>
<style>
:root{--bg:#eef1f4;--panel:#ffffff;--text:#16212b;--muted:#5d6b78;--accent:#0f766e;--accent-text:#ffffff;--line:#d3dae1;--grid:#b9c3cc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--panel:#18222b;--text:#e6edf3;--muted:#93a3b1;--accent:#2dd4bf;--accent-text:#06211e;--line:#2b3946;--grid:#2b3946;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--panel:#18222b;--text:#e6edf3;--muted:#93a3b1;--accent:#2dd4bf;--accent-text:#06211e;--line:#2b3946;--grid:#2b3946;color-scheme:dark}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
#v{flex:1;min-height:0;position:relative;touch-action:none}
#v canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;top:10px;font-size:13px;color:var(--muted);pointer-events:none}
#bar{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
button{flex:0 0 auto;font:inherit;font-size:14px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.add{border-style:dashed}
input[type=range]{flex:0 0 auto;width:100px;accent-color:var(--accent)}
#shp,#sv,#pr{position:fixed;left:0;right:0;top:0;bottom:var(--bh,0px);background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#shp.show,#sv.show,#pr.show{display:flex}
#shp>div,#sv>div,#pr>div{background:var(--panel);border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:75%;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;overflow-y:auto}
#grid button{font-size:13px;padding:10px 6px}
#brush{position:absolute;left:8px;right:8px;top:8px;z-index:3;display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:14px}
#brush.show{display:flex}
#brush input{flex:1;width:auto}
#brush b{min-width:30px;text-align:right}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:14px;z-index:4;display:none;max-width:90%;text-align:center;pointer-events:none}
.it{display:flex;gap:6px;align-items:center}
.it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sl{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px}
.sec{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.sec button{font-size:13px;padding:6px 10px}
.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--muted);font-size:13px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px}
.card img{width:72px;height:72px}
#bd{display:none;font-size:13px;padding:6px 10px}
#bd.show{display:inline-block}
#hd{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
#hd strong{flex:1}
#tl{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#tl input{flex:1;min-width:90px;width:auto}
.edx{display:none;font-size:13px;padding:6px 10px}
body[data-mode=edit] .edx{display:inline-block}
#brush{flex-wrap:wrap}
.rw{display:flex;gap:8px;align-items:center;font-size:14px}
.rw span{min-width:96px}
.rw input{flex:1;width:auto}
#prb{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
#nm,#shq{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);-webkit-user-select:text;user-select:text}
#pal{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:none;grid-template-columns:repeat(10,1fr);gap:5px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#pal.show{display:grid;max-height:42%;overflow-y:auto}
#pal button{padding:0;aspect-ratio:1;border-radius:50%;min-width:0;border:2px solid var(--line)}
#pal button.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}
input[type=color]{flex:0 0 auto;width:44px;height:38px;border:1px solid var(--line);border-radius:8px;background:transparent;padding:2px}
#dlg{position:fixed;left:0;right:0;top:0;bottom:var(--bh,0px);background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#dlg.show{display:flex}
#dlg div{background:var(--panel);border-radius:12px;padding:14px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
textarea{height:40vh;font:12px monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;-webkit-user-select:text;user-select:text}
</style>
<style>html:root:root:root{--bg:#3b3b3b;--panel:#2b2b2b;--text:#d9d9d9;--muted:#8f8f8f;--accent:#4772b3;--accent-text:#ffffff;--line:#1d1d1d;--grid:#4a4a4a;color-scheme:dark}button{background:#3d3d3d;border-color:#1d1d1d;border-radius:4px}</style>
<style>
#shp,#sv,#pr,#dlg{top:var(--hh,0px);bottom:0;align-items:flex-start}
#shp>div,#sv>div,#pr>div{max-height:100%;border-radius:0 0 14px 14px}
#grid,#sl,#prb{flex:1;min-height:0;overflow-y:auto}
button{transition:background .15s,transform .1s}
button:active{transform:scale(.97)}
#bar{padding:6px 8px 8px;gap:6px}
#bar>.row{flex-wrap:wrap;overflow:visible}
#bar>.row:first-child{flex-wrap:nowrap;border-bottom:1px solid var(--line);padding-bottom:6px}
#bar>.row:first-child button{flex:1;border:0;background:transparent;padding:8px 4px}
#bar>.row:first-child button.on{background:var(--accent)}
#hd{gap:6px}
#hd button{flex:1;font-size:12px;padding:8px 4px}
#tl{display:none;flex-direction:column;align-items:stretch;overflow:visible;gap:6px}
#tl.show{display:flex}
#tl .row{overflow-x:auto}
#tl .trk input{width:100%;flex:none;min-width:0}
.trk{position:relative;padding-bottom:14px}
.mks{position:absolute;left:10px;right:10px;bottom:0;height:12px}
.kfm{position:absolute;width:10px;height:10px;top:1px;background:#f5a623;border-radius:2px;transform:translateX(-50%) rotate(45deg)}
.chip{position:absolute;left:8px;top:8px;z-index:3;display:none;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text)}
.crow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.card2{flex:0 0 auto;width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;-webkit-touch-callout:none}
.card2 img,.card2 .ph{width:84px;height:84px;border-radius:8px;object-fit:contain;background:var(--bg)}
.ph{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.card2 span{font-size:12px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.lpb{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:240px;max-width:100%}
.lpb input,.lpb select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);-webkit-user-select:text;user-select:text}
</style>
<style>.rpbar{position:absolute;left:8px;right:8px;top:8px;z-index:5;display:none;flex-direction:column;gap:8px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:14px}.rpbar.show{display:flex}.rpbar input{width:100%}button:disabled{opacity:.4}</style>
<style>.fbtn{position:relative;display:inline-block;overflow:hidden;font-size:14px;color:var(--text);background:#3d3d3d;border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;flex:0 0 auto}.fbtn input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}.fbtn.off{opacity:.4}.fbtn.off input{pointer-events:none}.pbox{border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:12px;color:var(--muted);-webkit-user-select:text;user-select:text}</style>
</head>
<body>
<div id="hd"><strong>3D Studiya</strong><button id="prB">Xossalar</button></div>
<div id="v"><div id="toast"></div><div id="brush"><span>Oʻlcham</span><input type="range" id="rad" min="1" max="100" step="1" value="30" aria-label="Oʻlcham 1 dan 100 gacha"><b id="radv">30</b><button id="bd">Yoʻnalish: erkin</button></div><div id="pal"></div><div id="hint">Shakl qoʻshing, soʻng unga bosing</div></div>
<div id="tl"><button id="pl">Play</button><button id="st">Stop</button><input type="range" id="fr" min="1" max="250" value="1" aria-label="Kadr"><b id="frv">1</b><button id="kf">+Kalit</button><button id="kc">Kalitni oʻchir</button></div>
<div id="bar">
  <div class="row" id="shapes">
    <button class="add" data-s="box">Kub</button>
    <button class="add" data-s="sphere">Shar</button>
    <button class="add" data-s="cyl">Silindr</button>
    <button class="add" data-s="cone">Konus</button>
    <button class="add" data-s="torus">Halqa</button>
    <button id="more">+100 shakl</button>
  </div>
  <div class="row">
    <button class="on" data-m="translate">Surish</button>
    <button data-m="rotate">Aylantirish</button>
    <button data-m="scale">Oʻlcham</button>
    <button data-m="bend">Bukish</button>
    <button data-m="edit">Edit</button>
    <button data-m="paint">Boʻyash</button>
    <button data-m="carve">Oʻyish</button>
  </div>
  <div class="row">
    <input type="color" id="col" value="#14b8a6" aria-label="Rang">
    <button id="dup">Nusxa</button>
    <button id="mg">Birlashtirish</button>
    <button id="undo">Bekor</button>
    <button id="del">Oʻchirish</button>
    <button id="obj">OBJ</button>
  </div>
  <div class="row">
    <button id="foc">Fokus</button>
    <button id="svb">Saqlanganlar</button>
    <button id="lock">Kamera: erkin</button>
    <button id="sym">Simmetriya: oʻchiq</button>
  </div>
</div>
<div id="shp"><div><strong id="shn">Shakllar</strong><input id="shq" placeholder="Shakl qidirish..." autocomplete="off"><div id="grid"></div><button id="shc">Yopish</button></div></div>
<div id="pr"><div><div class="it" id="prt" style="overflow-x:auto"></div><div class="mut" id="prs"></div><div id="prb"></div><button id="prc">Yopish</button></div></div>
<div id="sv"><div><strong>Saqlanganlar</strong><div class="it"><input id="nm" placeholder="Nom (boʻlim yoki shakl uchun)" maxlength="40"><button id="sa" class="on">Yangi boʻlim</button></div><div id="sl"></div><div class="it"><button id="clr">Sahnani tozalash</button><button id="svc">Yopish</button></div></div></div>
<div id="dlg"><div>
  <strong>OBJ format (nusxalab oling)</strong>
  <textarea id="txt" readonly></textarea>
  <button id="cp">Nusxalash</button>
  <button id="cl">Yopish</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/ConvexHull.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/ConvexGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
const v=document.getElementById('v');
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,3));
v.appendChild(R.domElement);
const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(50,1,.01,12000);
C.position.set(5,4,6);
S.add(new THREE.HemisphereLight(0xffffff,0x667788,.9));
const L=new THREE.DirectionalLight(0xffffff,.8);L.position.set(5,8,4);S.add(L);
const grid=new THREE.GridHelper(3200,3200);S.add(grid);
const W=new THREE.Group();S.add(W);
let mode='translate',st=null,sym=false,locked=false;
const rc2=new THREE.Raycaster();
const ring=new THREE.Mesh(new THREE.RingGeometry(.96,1,48),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,depthTest:false,transparent:true,opacity:.9}));ring.visible=false;ring.renderOrder=10;S.add(ring);
function showRing(h){if(!h){ring.visible=false;return}const n=h.face.normal.clone().transformDirection(sel.matrixWorld);ring.position.copy(h.point).addScaledVector(n,.003);ring.lookAt(h.point.clone().add(n));ring.scale.setScalar(rad()*(sel.scale.x+sel.scale.y+sel.scale.z)/3);ring.visible=true}
function mirW(p){const v=C.getWorldDirection(new THREE.Vector3());rc2.set(p.clone().addScaledVector(v,.002),v);const hs=rc2.intersectObject(sel,false);if(hs.length)return hs[hs.length-1].point.clone();const g=sel.geometry;if(!g.boundingSphere)g.computeBoundingSphere();const c=sel.localToWorld(g.boundingSphere.center.clone());return p.clone().addScaledVector(v,-2*p.clone().sub(c).dot(v))}
function refN(nl){const v=C.getWorldDirection(new THREE.Vector3()).transformDirection(new THREE.Matrix4().copy(sel.matrixWorld).invert());return nl.clone().addScaledVector(v,-2*nl.dot(v))}
function both(f,lp,nl){f(sel,lp,nl);if(sym)f(sel,sel.worldToLocal(mirW(sel.localToWorld(lp.clone()))),nl&&refN(nl))}const sc=()=>mode==='bend'||mode==='carve'||mode==='paint'||mode==='raise'||mode==='dent'||mode==='erase';
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();
function aim(e){const r=R.domElement.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pt,C)}
const rad=()=>{const s=sel?(sel.scale.x+sel.scale.y+sel.scale.z)/3:1;return(.08+(+document.getElementById('rad').value)*.0112)/s};
function snap(m){const h=m.userData.h||(m.userData.h=[]);h.push({p:m.geometry.attributes.position.array.slice(),i:m.geometry.index.array.slice(),c:m.geometry.attributes.color.array.slice()});if(h.length>25)h.shift()}
function touch(m){const g=m.geometry;g.attributes.position.needsUpdate=true;g.computeVertexNormals();g.computeBoundingSphere();g.computeBoundingBox()}
function paint(m,lp,nl){const g=m.geometry,p=g.attributes.position,c=g.attributes.color,nr=g.attributes.normal,r=rad(),k=mode==='erase'?new THREE.Color().fromArray(m.userData.bc||[.08,.72,.65]):new THREE.Color(colEl.value);
 for(let i=0;i<p.count;i++){const d=Math.hypot(p.getX(i)-lp.x,p.getY(i)-lp.y,p.getZ(i)-lp.z);if(d<r&&(!nl||nr.getX(i)*nl.x+nr.getY(i)*nl.y+nr.getZ(i)*nl.z>-.1)){const w=Math.min(1,(1-d/r)*6);c.setXYZ(i,c.getX(i)+(k.r-c.getX(i))*w,c.getY(i)+(k.g-c.getY(i))*w,c.getZ(i)+(k.b-c.getZ(i))*w)}}
 c.needsUpdate=true}
function carve(m,lp,nl){const g=m.geometry,p=g.attributes.position.array,ix=g.index.array,r=rad(),out=[];
 for(let i=0;i<ix.length;i+=3){const a=ix[i]*3,b=ix[i+1]*3,c=ix[i+2]*3;
  const x=(p[a]+p[b]+p[c])/3-lp.x,y=(p[a+1]+p[b+1]+p[c+1])/3-lp.y,z=(p[a+2]+p[b+2]+p[c+2])/3-lp.z;
  let hit=x*x+y*y+z*z<=r*r;if(hit&&nl){const ux=p[b]-p[a],uy=p[b+1]-p[a+1],uz=p[b+2]-p[a+2],vx=p[c]-p[a],vy=p[c+1]-p[a+1],vz=p[c+2]-p[a+2],nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;hit=nx*nl.x+ny*nl.y+nz*nl.z>-.1*Math.hypot(nx,ny,nz)}
  if(!hit)out.push(ix[i],ix[i+1],ix[i+2])}
 if(out.length<ix.length)g.setIndex(new THREE.BufferAttribute(new Uint32Array(out),1))}
// Bukish / oʻyish: sahna boshqaruvidan oldin ishlaydi
R.domElement.addEventListener('pointerdown',e=>{
 if(!sel||!(sc()||mode==='edit'))return;
 aim(e);const h=ray.intersectObject(sel,false)[0];if(!h)return;
 O.enabled=false;snap(sel);showRing(h);
 const lp=sel.worldToLocal(h.point.clone());
 if(mode==='raise'||mode==='dent'){st={k:'r',last:h.point.clone()};both(raiseF,lp,h.face.normal);return}
 if(mode==='edit'){st={k:'e'};editSel(lp,h.face.normal);return}
 if(mode==='paint'||mode==='erase'){st={k:'p'};both(paint,lp,h.face.normal);return}
 if(mode==='carve'){st={k:'c'};both(carve,lp,h.face.normal);return}
 const pa=sel.geometry.attributes.position,base=pa.array.slice(),r=rad(),sets=[];
 const cs=[[lp,false]];let nn=null,mh=null;if(sym){nn=C.getWorldDirection(new THREE.Vector3()).normalize();mh=mirW(h.point);cs.push([sel.worldToLocal(mh.clone()),true])}
 const nrm=sel.geometry.attributes.normal;cs.forEach(([c,mir])=>{const nl=mir?refN(h.face.normal):h.face.normal,ids=[],ws=[];for(let i=0;i<pa.count;i++){const d=Math.hypot(base[i*3]-c.x,base[i*3+1]-c.y,base[i*3+2]-c.z);if(d<r&&nrm.getX(i)*nl.x+nrm.getY(i)*nl.y+nrm.getZ(i)*nl.z>-.1){const q=Math.min(1,(1-d/r)*2.5);ids.push(i);ws.push(q*q*(3-2*q))}}sets.push({ids,ws,mir})});
 st={k:'b',base,sets,n:nn,mhp:mh,nw:h.face.normal.clone().transformDirection(sel.matrixWorld),hp:h.point.clone(),pl:new THREE.Plane().setFromNormalAndCoplanarPoint(C.getWorldDirection(new THREE.Vector3()).negate(),h.point)};
});
addEventListener('pointermove',e=>{
 if((sc()||mode==='edit')&&sel){aim(e);showRing(ray.intersectObject(sel,false)[0])}else ring.visible=false;
 if(!st||st.k==='e'||st.k==='r')return;aim(e);
 if(st.k==='p'){const h=ray.intersectObject(sel,false)[0];if(h)both(paint,sel.worldToLocal(h.point.clone()),h.face.normal);return}
 if(st.k==='c'){const h=ray.intersectObject(sel,false)[0];if(h)both(carve,sel.worldToLocal(h.point.clone()),h.face.normal);return}
 const p=new THREE.Vector3();if(!ray.ray.intersectPlane(st.pl,p))return;
 let dw=p.clone().sub(st.hp);if(bendN&&st.nw)dw=st.nw.clone().multiplyScalar(dw.dot(new THREE.Vector3().setFromMatrixColumn(C.matrixWorld,1))*1.5);const d=sel.worldToLocal(st.hp.clone().add(dw)).sub(sel.worldToLocal(st.hp.clone()));
 let dm=null;if(st.n){{const vw=C.getWorldDirection(new THREE.Vector3()),dr=dw.clone().addScaledVector(vw,-2*dw.dot(vw));dm=sel.worldToLocal(st.mhp.clone().sub(dr)).sub(sel.worldToLocal(st.mhp.clone()))}}
 const a=sel.geometry.attributes.position.array;a.set(st.base);
 st.sets.forEach(s=>{const e=s.mir&&dm?dm:d;for(let k=0;k<s.ids.length;k++){const i=s.ids[k]*3,w=s.ws[k];a[i]+=e.x*w;a[i+1]+=e.y*w;a[i+2]+=e.z*w}});
 touch(sel)});
const endStroke=()=>{if(st){st=null;O.enabled=!locked;ring.visible=false}};
